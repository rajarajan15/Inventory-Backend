# Server Configuration
server.port=8080

# Application Name
spring.application.name=inventory-backend

# Active Spring Profile (defaults to 'local' for local development)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:inventory_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
# The schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks that it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway migrations. baseline-on-migrate adopts databases created before Flyway (by Hibernate) as version 1.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Health probes for load balancers / Kubernetes: /actuator/health, /actuator/health/liveness, /actuator/health/readiness
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# Email is best effort (async); an SMTP outage must not take the API out of the load balancer
management.health.mail.enabled=false
management.info.env.enabled=false

# Every log line carries the request ID (also returned as the X-Request-Id header and in error responses)
logging.pattern.level=%5p [%X{requestId:-}]

# JWT signing secret: REQUIRED, random, at least 32 characters (e.g. `openssl rand -base64 48`).
# Set JWT_SECRET in the environment or jwt.secret in application-local.properties. The app refuses to start without it.
# Access token: 15 min, Refresh token: 7 days
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# SpringDoc / Swagger UI
# Disable API docs in production with API_DOCS_ENABLED=false
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# CORS Allowed Origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Multipart upload limit (CSV import)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Frontend base URL used in email links: {base}/o/{slug}, {base}/invite/{token}, {base}/platform
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# StockWise super admin (exactly one; seeded on first start).
app.super-admin.email=${SUPER_ADMIN_EMAIL:stockwise.rr.2026@gmail.com}
# No default: required the first time the app starts on an empty database. Must satisfy the password policy.
app.super-admin.password=${SUPER_ADMIN_PASSWORD:}
app.super-admin.name=${SUPER_ADMIN_NAME:StockWise Owner}

# Seed a "demo" organization with sample data when no organizations exist
app.seed.demo-data=${SEED_DEMO_DATA:false}

# Invitation links validity
app.invitation.expiry-days=${INVITATION_EXPIRY_DAYS:7}

# Email via Gmail SMTP. Use a Google App Password (Google Account > Security > App passwords), not your login password.
# With MAIL_ENABLED=false emails are only written to the log.
app.mail.enabled=${MAIL_ENABLED:false}
# StockWise Gmail account. The App Password is a secret: set MAIL_PASSWORD in the environment or in
# application-local.properties (gitignored), never in this file.
spring.mail.username=${MAIL_USERNAME:stockwise.rr.2026@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:${spring.mail.username}}
# Where subscription request notifications for StockWise are sent
app.platform.notification-email=${PLATFORM_NOTIFICATION_EMAIL:${spring.mail.username}}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
