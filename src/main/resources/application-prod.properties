# Production profile (SPRING_PROFILES_ACTIVE=prod). All secrets come from environment variables.

# API docs are off unless explicitly enabled
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}

# Never seed demo data in production
app.seed.demo-data=false

# Behind a TLS-terminating proxy / load balancer: honour X-Forwarded-* headers
server.forward-headers-strategy=framework

# Finish in-flight requests on shutdown (rolling deploys)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Fail fast instead of hanging when the database is unreachable
spring.datasource.hikari.connection-timeout=10000
