# Test Configuration with H2 In-Memory DB
spring.application.name=inventory-backend-test
spring.datasource.url=jdbc:h2:mem:testdb-${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Same Flyway migrations as production; Hibernate validates the entities against them
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Test-only signing key (never used outside the H2 test context)
jwt.secret=test-only-secret-7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b
jwt.expiration=900000
jwt.refresh-token-expiration=604800000

app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

app.frontend.base-url=http://localhost:5173
app.super-admin.email=owner@stockwise.test
app.super-admin.password=Owner@12345
app.seed.demo-data=false
app.mail.enabled=false
